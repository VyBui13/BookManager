name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'

    - name: Install dependencies and build frontend
      run: |
        cd frontend
        npm install
        npm run dev

    - name: Install dependencies and start backend
      run: |
        cd backend
        npm install
        npm start
